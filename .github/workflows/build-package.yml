name: Build Package

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: "3.10"
      link-check:
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🐍 Install uv and set Python version ${{ inputs.python-version }}
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ inputs.python-version }}
          activate-environment: true

      - name: 🎨 Augment paths in README
        run: |
          python .github/scripts/augment_links.py README.md --branch ${{ github.head_ref || github.ref_name }}
          cat README.md

      - name: 🔗 Link Checker
        if: inputs.link-check
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.22.0
          args: |
            --config .github/lychee.toml
            README.md
          fail: true

      - name: 🏗️ Build source and wheel distributions
        run: |
          uv sync --frozen --group build
          uv build
          twine check --strict dist/*

      - name: 📤 Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
