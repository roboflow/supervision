name: Check links & references

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    # Run once a week on Sundays
    - cron: "0 9 * * 0"

concurrency:
  group: ci-check-links-${{ github.ref }}
  cancel-in-progress: true
jobs:
  links-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.22.0
          # default args: "--verbose --no-progress './**/*.md' './**/*.html' './**/*.rst'"
          args: |
            --verbose
            --no-progress
            --include-verbatim
            --exclude https://github.com/YOUR_USERNAME/supervision.git
            --exclude http://127.0.0.1:8000
            --retry-wait-time 3
            --max-concurrency 10
            --header "x-ratelimit-bypass=${{ secrets.UNIVERSE_RATELIMIT_BYPASS_KEY }}"
            './**/*.md'
          #'./**/*.py'
          #'./**/*.yml'
          #'./**/*.toml'
          fail: true
