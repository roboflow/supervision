name: Publish Supervision Pre-Releases to PyPI

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+a[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+b[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+.a[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+.b[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+.rc[0-9]+"
  workflow_dispatch:
  pull_request:
    branches: ["main", "develop", "release/*"]
    paths:
      - ".github/workflows/build-package.yml"
      - ".github/workflows/publish-pre-release.yml"

permissions: {} # Explicitly remove all permissions by default

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/build-package.yml
    with:
      # only run link check on PRs from the same repo
      link-check: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

  publish-pre-release:
    name: Publish Pre-release Package
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: test
      url: https://pypi.org/project/supervision/
    timeout-minutes: 10
    permissions:
      id-token: write # Required for PyPI publishing
      contents: read # Required for checkout
    steps:
      - name: 📥 Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: List distribution artifacts
        run: ls -lh dist/

      - name: 🚀 Publish to PyPi
        if: github.event_name != 'pull_request'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true
