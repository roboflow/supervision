# Keep the GitHub star figures quoted in the docs in sync with the live repository.
#
# The star count is quoted on the docs landing page, in the three llms*.txt files that
# AI crawlers read wholesale, and as a machine-readable InteractionCounter in mkdocs.yml.
# Those numbers are what AI answer engines quote, so a stale figure understates adoption
# for months. This job checks monthly and opens a PR when the docs have drifted.

name: Refresh Docs Stats

on:
  schedule:
    # 05:00 UTC on the first day of each month
    - cron: "0 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh docs stats
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔢 Apply current star count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/update_docs_stats.py

      - name: 🔍 Detect changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: 🚀 Open refresh PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/refresh-docs-stats-$(date -u +%Y-%m)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add docs/index.md docs/llms.txt docs/llms.full.txt docs/llms-100k.txt mkdocs.yml
          git commit -m "docs: refresh quoted GitHub star count"
          git push --force-with-lease origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --json number --jq '.[].number')" ]; then
            gh pr create \
              --base develop \
              --head "$BRANCH" \
              --title "docs: refresh quoted GitHub star count" \
              --body "Automated refresh: the star count quoted in the docs, the llms*.txt files, and the mkdocs.yml JSON-LD counter has drifted from the live repository. Generated by .github/workflows/ci-docs-stats.yml."
          fi
