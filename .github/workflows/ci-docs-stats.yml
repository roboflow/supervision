# Keep the GitHub star figures quoted in the docs in sync with the live repository.
#
# The star count is quoted on the docs landing page. This job checks monthly and opens a
# PR when that prose has drifted.

name: Refresh Docs Stats

on:
  schedule:
    # 05:00 UTC on the first day of each month
    - cron: "0 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh docs stats
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🌿 Prepare monthly refresh branch
        id: branch
        run: |
          BRANCH="chore/refresh-docs-stats-$(date -u +%Y-%m)"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          remote_branch_status=0
          git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null \
            || remote_branch_status=$?
          case "$remote_branch_status" in
            0)
              git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
              git switch --create "$BRANCH" --track "origin/$BRANCH"
              ;;
            2)
              git switch --create "$BRANCH"
              ;;
            *)
              echo "Unable to determine whether $BRANCH exists on origin." >&2
              exit "$remote_branch_status"
              ;;
          esac

      - name: 🔢 Apply current star count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/update_docs_stats.py

      - name: 🔍 Detect changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: 🚀 Open refresh PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.branch.outputs.name }}"
          git add docs/index.md
          git commit -m "docs: refresh quoted GitHub star count"
          if git rev-parse --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git push --force-with-lease="refs/heads/$BRANCH:$(git rev-parse "refs/remotes/origin/$BRANCH")" \
              origin "HEAD:refs/heads/$BRANCH"
          else
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          if [ -z "$(gh pr list --head "$BRANCH" --json number --jq '.[].number')" ]; then
            gh pr create \
              --base develop \
              --head "$BRANCH" \
              --title "docs: refresh quoted GitHub star count" \
              --body "Automated refresh: the star count quoted in the docs has drifted from the live repository. Generated by .github/workflows/ci-docs-stats.yml."
          fi
