name: Publish Supervision Releases to TestPyPI

on:
  workflow_dispatch:
  pull_request:
    branches: ["main", "develop", "release/*"]
    paths:
      - ".github/workflows/build-package.yml"
      - ".github/workflows/publish-testpypi.yml"

permissions: {} # Explicitly remove all permissions by default

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/build-package.yml # zizmor: ignore[self-repository] -- Local calls already use the workflow commit.

  publish-testpypi:
    name: Publish Release Package
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/supervision/
    timeout-minutes: 10
    permissions:
      id-token: write # Required for PyPI publishing
      contents: read # Required for checkout
    steps:
      - name: 📥 Download distribution artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: List distribution artifacts
        run: ls -lh dist/

      - name: 🚀 Publish to Test-PyPi
        if: github.event_name != 'pull_request'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true
