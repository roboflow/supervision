name: Publish Supervision Releases to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    branches: ["main", "develop", "release/*"]
    paths:
      - ".github/workflows/build-package.yml"
      - ".github/workflows/publish-release.yml"

permissions: {} # Explicitly remove all permissions by default

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/build-package.yml # zizmor: ignore[self-repository] -- Local calls already use the workflow commit.

  publish-release:
    name: Publish Release Package
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/supervision/
    timeout-minutes: 10
    permissions:
      id-token: write # Required for PyPI publishing
      contents: write # Required for checkout and upload assets
    steps:
      - name: 📥 Download distribution artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: List distribution artifacts
        run: ls -lh dist/

      - name: 📦 Upload assets to Release
        if: github.event_name == 'release'
        uses: AButler/upload-release-assets@34491005a5d7ec239a784e460807ce844fde7962 # v4.0.0
        with:
          files: "dist/*"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Publish to PyPi
        # We only want to publish to PyPi if the event is a release and it's not a pre-release.
        if: (github.event_name == 'release' && github.event.release.prerelease != true) || github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
