<g class="many"><rect x="58.5" y="94.5" width="143.0" height="103.0" fill="none" stroke="#16a34a" stroke-width="3"/><text class="mono" x="62.5" y="212.5" font-size="12" fill="#166534">#0 · 26 px</text><rect x="338.5" y="134.5" width="83.0" height="83.0" fill="none" stroke="#16a34a" stroke-width="3"/><text class="mono" x="342.5" y="232.5" font-size="12" fill="#166534">#1 · 12 px</text><rect x="218.5" y="234.5" width="123.0" height="63.0" fill="none" stroke="#16a34a" stroke-width="3"/><text class="mono" x="222.5" y="312.5" font-size="12" fill="#166534">#2 · 14 px</text></g>
<g class="cap-a"><text x="470" y="100" font-size="15" font-weight="700" fill="#111827">One class, three separate patches</text><text x="470" y="128" font-size="14" fill="#1f2937">The model labels every pixel.</text><text x="470" y="150" font-size="14" fill="#1f2937">Water appears in three places,</text><text x="470" y="172" font-size="14" fill="#1f2937">with land between them.</text></g>
<g class="cap-b"><text x="470" y="100" font-size="15" font-weight="700" fill="#9a3412">split_components=False (default)</text><text x="470" y="128" font-size="14" fill="#1f2937">One detection per class:</text><text x="470" y="150" font-size="14" fill="#1f2937">one mask over all water pixels,</text><text x="470" y="172" font-size="14" fill="#1f2937">one box over the whole scene.</text></g>
<g class="cap-c"><text x="470" y="100" font-size="15" font-weight="700" fill="#166534">split_components=True</text><text x="470" y="128" font-size="14" fill="#1f2937">One detection per 8-connected</text><text x="470" y="150" font-size="14" fill="#1f2937">patch: own mask, tight box</text><text x="470" y="172" font-size="14" fill="#1f2937">and area. Ordered top to bottom.</text></g>
<g class="cap-d"><text x="470" y="100" font-size="15" font-weight="700" fill="#111827">Same map, two results</text><text x="470" y="128" font-size="14" fill="#1f2937">Splitting turns one oversized</text><text x="470" y="150" font-size="14" fill="#1f2937">box into a box per patch, so</text><text x="470" y="172" font-size="14" fill="#1f2937">counts and areas match reality.</text></g>
<g class="n-false"><text class="mono" x="470" y="274" font-size="13" fill="#9a3412">split_components=False</text><text x="470" y="300" font-size="20" font-weight="700" fill="#111827">1 detection · 52 px</text></g>
<g class="n-true"><text class="mono" x="470" y="334" font-size="13" fill="#166534">split_components=True</text><text x="470" y="360" font-size="20" font-weight="700" fill="#111827">3 detections · 26 + 12 + 14 px</text></g>
</svg>
