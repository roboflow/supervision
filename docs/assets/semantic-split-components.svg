<text x="40" y="338" font-size="12" fill="#374151">class map: 1 = water (blue), 0 = land (grey)</text>
<g class="one"><rect x="58.5" y="94.5" width="363.0" height="203.0" fill="none" stroke="#ea580c" stroke-width="3" stroke-dasharray="8 5"/><text class="mono" x="62.5" y="88.5" font-size="12" fill="#9a3412">water · 52 px</text></g>
