<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" width="760" height="384" role="img" aria-labelledby="t d" class="anim">
<title id="t">Semantic segmentation: one detection per class versus one per patch</title>
<desc id="d">Animation of a 20 by 12 class map with three separate water patches. With the default split_components=False, supervision returns one water detection of 52 pixels whose box spans all three patches and the land between them. With split_components=True it returns three detections of 26, 12 and 14 pixels, each with its own tight box.</desc>
